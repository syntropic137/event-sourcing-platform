services:
  event-store:
    build:
      context: .
      dockerfile: ./event-store/Dockerfile
    container_name: event-store
    # No host port published here on purpose (ADR-024): eventstore-bin has
    # no authn/authz of its own. The `gateway` service is the only
    # component permitted to reach the outside world.
    environment:
      DATABASE_URL: ${DATABASE_URL}
      BACKEND: ${BACKEND:-postgres}
      GRPC_PORT: ${GRPC_PORT:-50051}
      # eventstore-bin actually reads BIND_ADDR, not GRPC_PORT (see
      # event-store/eventstore-bin/src/main.rs) - wire it explicitly so a
      # non-default GRPC_PORT (e.g. running multiple environments per host)
      # takes effect, instead of GRPC_PORT silently doing nothing while
      # the container keeps listening on the 50051 default.
      BIND_ADDR: "0.0.0.0:${GRPC_PORT:-50051}"
      RUST_LOG: ${RUST_LOG:-info}
    restart: unless-stopped
    healthcheck:
      # The runtime image ships no grpcurl; a TCP probe on the configured
      # port (same as the Ansible template) is what actually works here.
      test: ["CMD", "bash", "-c", "</dev/tcp/localhost/${GRPC_PORT:-50051}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - eventstore-network

  # nginx gateway: the event store's trust boundary. See ADR-024 and
  # event-store/gateway/README.md. This is the only service in this file
  # permitted to publish a port to the host.
  gateway:
    build:
      context: ./event-store/gateway
    container_name: event-store-gateway
    ports:
      # ESP_GATEWAY_BIND defaults to 127.0.0.1 so the default (password
      # unset, TLS off) setup is never reachable from the LAN. To expose it,
      # set ESP_GATEWAY_PASSWORD AND ESP_GATEWAY_BIND=0.0.0.0 AND add
      # docker-compose.tls.yml (TLS, #301); the gateway refuses to start
      # plaintext on a non-loopback bind.
      - "${ESP_GATEWAY_BIND:-127.0.0.1}:${GRPC_PORT:-50051}:8081"
    environment:
      ESP_UPSTREAM: "event-store:${GRPC_PORT:-50051}"
      # Local dev default: plaintext on loopback. docker-compose.tls.yml
      # turns TLS on and mounts the certificate (event-store/gateway/README.md).
      ESP_GATEWAY_TLS: ${ESP_GATEWAY_TLS:-off}
      ESP_GATEWAY_PUBLISH_BIND: ${ESP_GATEWAY_BIND:-127.0.0.1}
      ESP_GATEWAY_USER: ${ESP_GATEWAY_USER:-admin}
      # Intentionally NOT required here (unlike the Proxmox/AWS Ansible
      # deploy paths, where it's a hard failure - see render_config.py).
      # Root docker-compose.yml is also used for local/dev runs; leaving
      # this unset disables Basic Auth with a loud startup warning
      # (docker-entrypoint.sh), matching ADR-024's documented "unset = off"
      # behavior. Set it for anything reachable outside your own machine.
      ESP_GATEWAY_PASSWORD: ${ESP_GATEWAY_PASSWORD:-}
    restart: unless-stopped
    depends_on:
      - event-store
    networks:
      - eventstore-network

  # Optional PostgreSQL - only runs with --profile local
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: eventstore-postgres
    profiles: ["local"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eventstore}
      POSTGRES_USER: ${POSTGRES_USER:-eventstore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eventstore}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - eventstore-network

volumes:
  postgres_data:
    driver: local

networks:
  eventstore-network:
    driver: bridge
