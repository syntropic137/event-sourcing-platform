[package]
name = "eventstore-backend-postgres"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1"
async-trait = "0.1"
eventstore-core = { path = "../eventstore-core" }
eventstore-proto = { path = "../eventstore-proto" }
tokio-stream = "0.1"
thiserror = "2"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "macros", "postgres", "migrate"] }
tokio = { version = "1", features = ["time", "sync", "rt", "macros"] }
tracing = "0.1"
futures = "0.3"
prost = "0.14"

[features]
default = []
# Enables Postgres integration tests using testcontainers
pg-integration = []
# Enables test utilities for integration tests
test-utils = []

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["postgres"] }
tonic = { version = "0.14", default-features = false }
once_cell = "1.19"
eventstore-core = { path = "../eventstore-core", features = ["conformance"] }
sha2 = "0.10"

[[test]]
name = "it_conformance"
path = "tests/it_conformance.rs"
required-features = ["test-utils"]

[[test]]
name = "it_idempotency"
path = "tests/it_idempotency.rs"
required-features = ["test-utils"]

[[test]]
name = "it_postgres"
path = "tests/it_postgres.rs"
required-features = ["test-utils"]

[[test]]
name = "it_commit_order"
path = "tests/it_commit_order.rs"
required-features = ["test-utils"]

[[test]]
name = "it_subscribe_faults"
path = "tests/it_subscribe_faults.rs"
required-features = ["test-utils"]

[[test]]
name = "it_subscribe_undecodable"
path = "tests/it_subscribe_undecodable.rs"
required-features = ["test-utils"]

[[test]]
name = "it_timeouts"
path = "tests/it_timeouts.rs"
required-features = ["test-utils"]

[[test]]
name = "it_append_batch"
path = "tests/it_append_batch.rs"
required-features = ["test-utils"]

[[test]]
name = "it_subscribe_prefix"
path = "tests/it_subscribe_prefix.rs"
required-features = ["test-utils"]

[[test]]
name = "it_subscribe_paging"
path = "tests/it_subscribe_paging.rs"
required-features = ["test-utils"]
