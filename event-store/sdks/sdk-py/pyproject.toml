[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eventstore-sdk-py"
version = "0.17.1"
description = "Python SDK for Rust Event Store (experimental)"
authors = [{name = "EventStore"}]
requires-python = ">=3.10"
# The checked-in stubs were generated by grpcio-tools 1.76.0 (protobuf gencode
# 6.31.1), the same as event-sourcing/python's; they refuse older runtimes.
# Regenerate with `make -C event-store gen-py`, which pins that version.
dependencies = [
  "grpcio>=1.76.0",
  "protobuf>=6.31.1,<7",
]

[project.optional-dependencies]
codegen = ["grpcio-tools==1.76.0"]

[tool.setuptools.packages.find]
include = ["sdk_py*"]

[tool.setuptools.package-data]
"*" = ["*.pyi"]
