# OSV Scanner configuration — accepted risk, recorded per advisory.
#
# Each entry must say which of two things it is, because they need different
# follow-up:
#   NO FIX EXISTS  - nothing to upgrade to; revisit when upstream ships one.
#   DEFERRED       - a fixed version exists, but taking it is a major upgrade we
#                    have not done yet. These are debt, not permanent exemptions.
#
# Reviewed 2026-09-16 (Codex review of PR #305). Several reasons here previously
# said "no fix" or "awaiting upstream" when a fix had already shipped; one of
# them hid two HIGH image-size advisories that a patch release resolved. A
# suppression reason goes stale silently - re-check the claim, not just the id.

# Rust: rsa 0.9.10, locked as a dependency of sqlx-mysql 0.8.6.
# NO FIX EXISTS for the Marvin Attack (RUSTSEC-2023-0071).
# NOT in the active build graph: `cargo tree -i rsa --workspace -e all` prints nothing.
# It is in Cargo.lock (so OSV flags it) but compiled into nothing. Previously
# mis-attributed to testcontainers -> bollard.
[[IgnoredVulns]]
id = "RUSTSEC-2023-0071"
reason = "NO FIX EXISTS (Marvin Attack). rsa is locked via sqlx-mysql 0.8.6 but absent from the active build graph (cargo tree -i rsa: empty). Not compiled into any artifact."

# Rust: sqlx-postgres 0.8.6 → rand 0.8.5 (PRODUCTION: eventstore-bin ->
#   eventstore-backend-postgres -> sqlx), portpicker 0.1.1 → rand 0.8.5 (dev)
# RUSTSEC-2026-0097: unsound with custom logger using rand::rng(). Severity: LOW.
# Requires: log + thread_rng features enabled, custom logger calling rand::rng(), reseeding.
# sqlx uses rand internally for connection jitter - does not meet trigger conditions.
# DEFERRED: sqlx 0.9.0 is STABLE (since May 2026) and uses patched rand 0.10.1.
# Taking it is a major sqlx upgrade. Accepted meanwhile only because the trigger
# conditions are narrow - not because no fix exists.
[[IgnoredVulns]]
id = "RUSTSEC-2026-0097"
reason = "DEFERRED. rand 0.8.5 IS on a production path (eventstore-bin via sqlx-postgres 0.8.6). LOW severity; needs a custom logger calling rand::rng() reentrantly, which sqlx does not do. Fix: upgrade to stable sqlx 0.9.0 (rand 0.10.1)."

[[IgnoredVulns]]
id = "GHSA-cq8v-f236-94qc"
reason = "Duplicate advisory for RUSTSEC-2026-0097 (rand 0.8.5 unsoundness). Same justification."

