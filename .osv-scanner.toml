# OSV Scanner configuration — accepted risk, recorded per advisory.
#
# Each entry must say which of two things it is, because they need different
# follow-up:
#   NO FIX EXISTS  - nothing to upgrade to; revisit when upstream ships one.
#   DEFERRED       - a fixed version exists, but taking it is a major upgrade we
#                    have not done yet. These are debt, not permanent exemptions.
#
# Reviewed 2026-09-16 (Codex review of PR #305). Several reasons here previously
# said "no fix" or "awaiting upstream" when a fix had already shipped; one of
# them hid two HIGH image-size advisories that a patch release resolved. A
# suppression reason goes stale silently - re-check the claim, not just the id.

# Rust: testcontainers → bollard → rustls-pemfile (dev-only dep, deprecated crate)
# No fix version exists. Only used in test infrastructure, not production.
[[IgnoredVulns]]
id = "RUSTSEC-2025-0134"
reason = "rustls-pemfile is a dev-only transitive dep (testcontainers → bollard). No fix available. Not in production."

