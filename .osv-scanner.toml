# Rust: sqlx-postgres 0.8.6 → rand 0.8.5 (PRODUCTION: eventstore-bin ->
#   eventstore-backend-postgres -> sqlx), portpicker 0.1.1 → rand 0.8.5 (dev)
# RUSTSEC-2026-0097: unsound with custom logger using rand::rng(). Severity: LOW.
# Requires: log + thread_rng features enabled, custom logger calling rand::rng(), reseeding.
# sqlx uses rand internally for connection jitter - does not meet trigger conditions.
# DEFERRED: sqlx 0.9.0 is STABLE (since May 2026) and uses patched rand 0.10.1.
# Taking it is a major sqlx upgrade. Accepted meanwhile only because the trigger
# conditions are narrow - not because no fix exists.
[[IgnoredVulns]]
id = "RUSTSEC-2026-0097"
reason = "DEFERRED. rand 0.8.5 IS on a production path (eventstore-bin via sqlx-postgres 0.8.6). LOW severity; needs a custom logger calling rand::rng() reentrantly, which sqlx does not do. Fix: upgrade to stable sqlx 0.9.0 (rand 0.10.1)."

[[IgnoredVulns]]
id = "GHSA-cq8v-f236-94qc"
reason = "Duplicate advisory for RUSTSEC-2026-0097 (rand 0.8.5 unsoundness). Same justification."

