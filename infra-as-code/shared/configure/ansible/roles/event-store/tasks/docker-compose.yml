---
# Docker Compose deployment tasks
# Deploy Event Store as a Docker Compose stack

- name: Create Event Store directory
  ansible.builtin.file:
    path: /opt/eventstore
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"

- name: Check if Docker image exists on local machine
  delegate_to: localhost
  become: false
  ansible.builtin.stat:
    path: /tmp/event-store-amd64.tar.gz
  register: local_image

- name: Fail if Docker image not built
  ansible.builtin.fail:
    msg: |
      Docker image not found at /tmp/event-store-amd64.tar.gz
      
      Please build the image first:
        cd infra-as-code && make docker-build-and-save
  when: not local_image.stat.exists

- name: Transfer Docker image to VM
  ansible.builtin.copy:
    src: /tmp/event-store-amd64.tar.gz
    dest: /tmp/event-store-amd64.tar.gz
    mode: "0644"
  register: image_transfer

- name: Load Docker image on VM
  ansible.builtin.shell:
    cmd: gunzip -c /tmp/event-store-amd64.tar.gz | docker load
  when: image_transfer.changed
  register: image_load

- name: Display image load result
  ansible.builtin.debug:
    var: image_load.stdout_lines
  when: image_transfer.changed

- name: Clean up transferred image file
  ansible.builtin.file:
    path: /tmp/event-store-amd64.tar.gz
    state: absent

- name: Check if Gateway Docker image exists on local machine
  delegate_to: localhost
  become: false
  ansible.builtin.stat:
    path: /tmp/gateway-amd64.tar.gz
  register: local_gateway_image

- name: Fail if Gateway Docker image not built
  ansible.builtin.fail:
    msg: |
      Gateway Docker image not found at /tmp/gateway-amd64.tar.gz

      This is the event store's auth boundary (ADR-024) - it must be
      deployed alongside event-store, never skipped.

      Please build both images first:
        cd infra-as-code && make docker-build-and-save
  when: not local_gateway_image.stat.exists

- name: Transfer Gateway image to VM
  ansible.builtin.copy:
    src: /tmp/gateway-amd64.tar.gz
    dest: /tmp/gateway-amd64.tar.gz
    mode: "0644"
  register: gateway_image_transfer

- name: Load Gateway image on VM
  ansible.builtin.shell:
    cmd: gunzip -c /tmp/gateway-amd64.tar.gz | docker load
  when: gateway_image_transfer.changed
  register: gateway_image_load

- name: Display gateway image load result
  ansible.builtin.debug:
    var: gateway_image_load.stdout_lines
  when: gateway_image_transfer.changed

- name: Clean up transferred gateway image file
  ansible.builtin.file:
    path: /tmp/gateway-amd64.tar.gz
    state: absent

- name: Create docker-compose.yml from template
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: /opt/eventstore/docker-compose.yml
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    # 0600, not the previous 0644 (world-readable): this file now embeds
    # the gateway's plaintext Basic Auth password directly (moved here
    # from .env in a prior round, to stop sharing DB credentials with the
    # gateway container) - it needs the same protection .env already has.
    mode: "0600"
  # Rendered file embeds ESP_GATEWAY_PASSWORD; keep it out of --diff output
  # and task logs.
  diff: false
  no_log: true

- name: Create .env file from template
  ansible.builtin.template:
    src: env.j2
    dest: /opt/eventstore/.env
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0600"
  # Carries DATABASE_URL/POSTGRES_PASSWORD; keep out of --diff and logs.
  diff: false
  no_log: true

- name: Start Event Store with Docker Compose
  community.docker.docker_compose_v2:
    project_src: /opt/eventstore
    state: present
  register: compose_result

- name: Wait for Event Store's own gRPC port to accept connections
  # Checks the event-store container directly, not the published host port
  # (which now points at `gateway`, ADR-024). eventstore-bin only starts
  # listening after its backend connection succeeds (see
  # event-store/eventstore-bin/src/main.rs), so this is a meaningful
  # readiness signal - unlike probing the gateway's port, which binds and
  # accepts connections immediately regardless of whether the upstream
  # event-store is actually reachable.
  ansible.builtin.command:
    cmd: >-
      docker exec event-store
      bash -c "</dev/tcp/127.0.0.1/{{ eventstore_grpc_port }}"
  register: eventstore_ready
  until: eventstore_ready.rc == 0
  retries: 12
  delay: 5
  changed_when: false

- name: Wait for gateway to accept connections
  ansible.builtin.wait_for:
    host: localhost
    port: "{{ eventstore_grpc_port }}"
    delay: 2
    timeout: 30
    state: started

- name: Display Event Store status
  ansible.builtin.debug:
    msg: "Event Store is running; gateway published on port {{ eventstore_grpc_port }} (ADR-024, Basic Auth enforced)"

- name: Show running containers
  ansible.builtin.command:
    cmd: docker ps --filter "name=event-store"
  register: docker_ps
  changed_when: false

- name: Display running containers
  ansible.builtin.debug:
    var: docker_ps.stdout_lines
