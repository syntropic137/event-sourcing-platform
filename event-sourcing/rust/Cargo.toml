[package]
name = "event-sourcing-rust"
version = "0.18.0"
edition = "2021"
authors = ["Event Sourcing Platform Team"]
description = "Rust SDK for Event Sourcing patterns and abstractions"
license = "MIT"
repository = "https://github.com/yourorg/event-sourcing-platform"
keywords = ["event-sourcing", "cqrs", "ddd", "aggregate"]
categories = ["database", "web-programming"]

[dependencies]
# Core async runtime
tokio = { version = "1.51", features = ["full"] }
async-trait = "0.1"

# Error handling
anyhow = "1.0"
thiserror = "2"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# IDs and time
uuid = { version = "1.0", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# gRPC client for event store. The high-level SDK is layered on the
# low-level client (eventstore-sdk-rs) rather than duplicating it.
tonic = "0.14"
prost = "0.14"
prost-types = "0.14"
eventstore-proto = { path = "../../event-store/eventstore-proto" }
eventstore-sdk-rs = { path = "../../event-store/sdks/sdk-rs" }
tokio-stream = "0.1"
tokio-util = "0.7"

# Optional Postgres projection/checkpoint store (feature "postgres")
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres"], optional = true }

# Logging
tracing = "0.1"

# Development dependencies
[dev-dependencies]
tokio-test = "0.4"
mockall = "0.14"
rstest = "0.26"

# Live-server tests and examples spawn the real gRPC event store in-process
eventstore-core = { path = "../../event-store/eventstore-core" }
eventstore-backend-memory = { path = "../../event-store/eventstore-backend-memory" }
eventstore-backend-postgres = { path = "../../event-store/eventstore-backend-postgres" }
eventstore-bin = { path = "../../event-store/eventstore-bin" }
portpicker = "0.1.1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres"] }

[features]
default = []
postgres = ["dep:sqlx"]

[[example]]
name = "basic_aggregate"
path = "examples/basic_aggregate.rs"

[[example]]
name = "order_processing"
path = "examples/order_processing.rs"

[[example]]
name = "repository"
path = "examples/repository.rs"

[[example]]
name = "supervised_projection"
path = "examples/supervised_projection.rs"
