name: Release Gate

# Runs when a PR targets the `release` branch.
# All checks must pass before the PR can be merged.

on:
  pull_request:
    branches: [release]

permissions:
  contents: read

jobs:
  version-check:
    name: Version Consistency & Bump Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          fetch-depth: 0  # Need full history to compare with release branch

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Validate version consistency
        run: python3 scripts/bump_version.py --check

      - name: Validate version is bumped
        run: python3 scripts/bump_version.py --check-bumped

  release-notes:
    name: Release Notes Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Check PR body has release notes
        # Read the body live from the API, not from github.event.pull_request.body.
        # The event payload is frozen at trigger time, so editing the body and
        # re-running this job would replay the old text and never go green (#333).
        #
        # The PR body is attacker-controlled text. It MUST reach the shell as
        # DATA: it is assigned from command substitution of a trusted command and
        # never appears inside a ${{ }} expansion in the script body (#316).
        # Only the PR number (an integer) comes from the event payload.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          PR_BODY=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.body // ""')
          if [ "${#PR_BODY}" -lt 20 ]; then
            echo "PR body must contain release notes (at least 20 characters)"
            exit 1
          fi
          echo "Release notes present (${#PR_BODY} characters)"

  ci-check:
    name: Full CI Suite
    uses: ./.github/workflows/ci.yml

  # vsa-ci.yml is path-filtered on main, so a VSA break can land on main
  # unnoticed. Run it unfiltered here so it blocks the release.
  vsa-check:
    name: VSA CI
    uses: ./.github/workflows/vsa-ci.yml
    permissions:
      contents: read
      checks: write  # rustsec/audit-check reports via a check run

  security-check:
    name: Security Scanning
    uses: ./.github/workflows/security.yml

  docker-dry-run:
    name: Docker Build (dry run)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v3

      - name: Build event-store image (no push)
        run: |
          docker buildx build \
            --platform linux/amd64 \
            -f event-store/Dockerfile \
            --output type=cacheonly \
            .
          echo "✅ Docker image builds successfully"

  gate:
    name: Release Gate
    runs-on: ubuntu-latest
    needs: [version-check, release-notes, ci-check, vsa-check, security-check, docker-dry-run]
    if: always()

    steps:
      - name: Check all gates passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$NEEDS" | jq -e 'any(.[]; .result != "success")' > /dev/null; then
            echo "Release gate failed: one or more checks did not pass"
            exit 1
          fi
          echo "All release gates passed"
